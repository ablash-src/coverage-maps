const unitsField = "units";
const storeField = "total_store_count";
const labelField = "zip";
const partnerConfig = [{"field": "UK_Asda", "color": "#FF6B35"}, {"field": "UK_Evri", "color": "#FFC857"}, {"field": "UK_Morrisons", "color": "#A855F7"}, {"field": "UK_PostOffice", "color": "#F472B6"}, {"field": "UK_WFM", "color": "#84CC16"}];

const map = L.map('map').setView([54, -2], 6);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
    maxZoom: 19
}).addTo(map);

let maxUnits = 0, maxStores = 0;
geojson.features.forEach(f => {
    const u = f.properties[unitsField] || 0;
    const s = f.properties[storeField] || 0;
    if (u > maxUnits) maxUnits = u;
    if (s > maxStores) maxStores = s;
});

// Units layer
const unitsLayer = L.layerGroup();
geojson.features.forEach(f => {
    const coords = f.geometry.coordinates;
    const val = f.properties[unitsField] || 0;
    if (val === 0) return;
    const label = f.properties[labelField] || '';
    const radius = Math.max(4, (val / maxUnits) * 50);
    const circle = L.circleMarker([coords[1], coords[0]], {
        radius: radius,
        fillColor: '#9FDEF1',
        fillOpacity: 0.4,
        color: '#7BBCD4',
        weight: 1
    });
    circle.bindTooltip(label + ': ' + val.toLocaleString() + ' units');
    unitsLayer.addLayer(circle);
});
unitsLayer.addTo(map);

// Total store count layer
const storesLayer = L.layerGroup();
geojson.features.forEach(f => {
    const coords = f.geometry.coordinates;
    const val = f.properties[storeField] || 0;
    if (val === 0) return;
    const label = f.properties[labelField] || '';
    const radius = Math.max(2, (val / maxStores) * 5);
    const circle = L.circleMarker([coords[1], coords[0]], {
        radius: radius,
        fillColor: '#DE3B00',
        fillOpacity: 0.6,
        color: '#B02F00',
        weight: 1
    });
    circle.bindTooltip(label + ': ' + val + ' stores');
    storesLayer.addLayer(circle);
});
storesLayer.addTo(map);

// Partner layers
const partnerLayers = [];
partnerConfig.forEach((p, i) => {
    const layer = L.layerGroup();
    geojson.features.forEach(f => {
        const coords = f.geometry.coordinates;
        const val = f.properties[p.field] || 0;
        if (val === 0) return;
        const label = f.properties[labelField] || '';
        const radius = Math.max(2, (val / maxStores) * 5);
        const circle = L.circleMarker([coords[1], coords[0]], {
            radius: radius,
            fillColor: p.color,
            fillOpacity: 0.7,
            color: p.color,
            weight: 1
        });
        circle.bindTooltip(label + ': ' + val + ' ' + p.field);
        layer.addLayer(circle);
    });
    layer.addTo(map);
    partnerLayers.push(layer);
});

// Toggle controls
document.getElementById('toggleUnits').addEventListener('change', function() {
    this.checked ? map.addLayer(unitsLayer) : map.removeLayer(unitsLayer);
});
document.getElementById('toggleStores').addEventListener('change', function() {
    this.checked ? map.addLayer(storesLayer) : map.removeLayer(storesLayer);
});
partnerConfig.forEach((p, i) => {
    document.getElementById('togglePartner' + i).addEventListener('change', function() {
        this.checked ? map.addLayer(partnerLayers[i]) : map.removeLayer(partnerLayers[i]);
    });
});

// Legend
const legend = L.control({position: 'bottomleft'});
legend.onAdd = function() {
    const div = L.DomUtil.create('div', 'legend');
    let html = '<h4>Legend</h4>'
        + '<div class="legend-item"><div class="legend-circle" style="background:#9FDEF1;opacity:0.5"></div>Units (demand)</div>'
        + '<div class="legend-item"><div class="legend-circle" style="background:#DE3B00;opacity:0.7"></div>Total Store Count</div>';
    partnerConfig.forEach(p => {
        html += '<div class="legend-item"><div class="legend-circle" style="background:' + p.color + ';opacity:0.7"></div>' + p.field + '</div>';
    });
    div.innerHTML = html;
    return div;
};
legend.addTo(map);

const bounds = L.geoJSON(geojson).getBounds();
map.fitBounds(bounds);
map.setMaxBounds(bounds.pad(0.3));
map.options.minZoom = map.getZoom() - 1;
</script>
